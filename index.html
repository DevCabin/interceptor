// #region spawning — traffic, enemies, trucks, pursuers, drops ------------------------------------
function spawnAhead() {
  const want = Math.min(4 + Math.floor(G.level * 0.8), 9);
  let count = 0;
  for (const c of G.cars) if (!c.dead && c.z > G.playerZ) count++;
  if (count >= want) return;
  const lanes = [-CFG.laneW, 0, CFG.laneW];
  const z = G.playerZ + rand(550, 1450);
  const lane = choice(lanes);
  for (const c of G.cars) {
    if (!c.dead && Math.abs(c.z - z) < 90 && Math.abs(c.x - lane) < 2) return;
  }
  const isEnemy = Math.random() < 0.48;
  G.cars.push({
    z, x: lane, baseX: lane,
    speed: isEnemy ? rand(30, 42) : rand(26, 37),
    type: isEnemy ? "enemy" : "civ",
    hp: CFG.enemyHp,
    spr: isEnemy ? "enemy" : "civ" + randInt(0, Sprites.civs.length - 1),
    dead: false, spin: 0, spinDir: 1, wob: rand(0, 6.28), laneTimer: rand(4, 9),
  });
  if (isEnemy && !G.fireHintShown && !G.hasFired) {
    G.fireHintShown = true;
    announce("HOLD FIRE TO SHOOT", "machine guns are unlimited — right thumb", 3.0);
  }
}
function spawnVan() {
  const lane = choice([-CFG.laneW, 0, CFG.laneW]);
  G.van = {
    z: G.playerZ + 850, x: lane, baseX: lane, speed: 46,
    type: "van", hp: 999, spr: "van",
    dead: false, spin: 0, spinDir: 1, wob: 0, laneTimer: 999,
  };
  G.cars.push(G.van);
  G.vanWarned = false;
}
function spawnChaser(dist = 300) {
  const ti = Math.min(G.level - 1, CHASER_TIERS.length - 1);
  const tier = CHASER_TIERS[ti];
  G.chasers.push({
    dist, speed: G.speed + rand(6, 12), x: clamp(G.playerX + rand(-2.5, 2.5), -5, 5),
    fireCd: rand(1.2, 2.2), muzzle: 0,
    state: "approach", spin: 0, wob: rand(0, 6.28),
    tierIdx: ti, tier, oilHp: tier.oilHp, blindT: 0,
    speedBonus: tier.speedBonus + Math.max(0, G.level - CHASER_TIERS.length) * 1.2,
    maxSpeed: CFG.maxSpeed * 1.12 + tier.speedBonus * 0.5, // ~165-175 mph — boost outruns them
  });
}

// green supply truck — shoot it and it drops the next rotating power-up
const DROP_CYCLE = ["smoke", "boost", "oil", "missiles", "armor"];
function spawnTruck(dz) {
  const lane = choice([-CFG.laneW, 0, CFG.laneW]);
  G.cars.push({
    z: G.playerZ + (dz || rand(450, 750)), x: lane, baseX: lane,
    speed: rand(30, 36),                   // slow — you will catch it
    type: "truck", hp: 5, spr: "truck",
    dead: false, spin: 0, spinDir: 1, wob: rand(0, 6.28), laneTimer: rand(4, 7),
    warned: false,
  });
}
function applyDrop(kind) {
  AudioSys.sfx.dock();
  G.score += 50;
  if (kind === "smoke") {
    G.weapons.smoke = Math.min(3, G.weapons.smoke + 1); G.smoke.cooldown = 0;
    announce("SMOKE SCREEN +1", "press SMK — blinds pursuers (" + G.weapons.smoke + "/3)", 2.4);
  } else if (kind === "boost") {
    G.boost.charges = Math.min(CFG.boostCap, G.boost.charges + 1);
    announce("SPEED BOOST +1", "push ▲ on the stick (or ↑ / W) to light it", 2.6);
  } else if (kind === "oil") {
    G.weapons.oil = Math.min(CFG.oilAmmo, G.weapons.oil + 2);
    announce("OIL SLICK +2", "press OIL — spins out pursuers", 2.4);
  } else if (kind === "missiles") {
    G.weapons.missiles += 2;
    announce("MISSILES +2", "press MSL to fire", 2.4);
  } else {
    G.armor = Math.min(100, G.armor + 30);
    announce("ARMOR PATCHED", "+30", 2.0);
  }
}

// #endregion spawning -----------------------------------------------------------------------------
// #region van docking — the weapons-van resupply sequence -----------------------------------------
const UPGRADES = [
  () => { G.weapons.missiles += CFG.missileAmmo; return ["MISSILES ONLINE", `${CFG.missileAmmo} forward missiles — press MSL / X`]; },
  () => { G.weapons.smoke = 3; return ["SMOKE SCREEN FITTED", "3 charges — press SMK / C to blind pursuers"]; },
  () => { G.weapons.oil += CFG.oilAmmo; return ["OIL SLICK ARMED", `${CFG.oilAmmo} slicks — press OIL / V`]; },
  () => { G.weapons.seekers += CFG.seekerAmmo; G.weapons.missiles = 0; return ["HEAT-SEEKERS ONLINE", `${CFG.seekerAmmo} missiles now lock targets`]; },
];
function dockVan() {
  G.docks++;
  G.score += CFG.vanScore;
  let msg;
  if (G.docks <= UPGRADES.length) msg = UPGRADES[G.docks - 1]();
  else {
    G.weapons.seekers += 4; G.weapons.oil += 2; G.armor = Math.min(100, G.armor + 15);
    msg = ["RESUPPLY COMPLETE", "+4 seekers  +2 oil  +15 armor"];
  }
  announce(msg[0], msg[1], 3.0);
  AudioSys.sfx.dock();
  setTimeout(() => AudioSys.sfx.upgrade(), 350);
}

// #endregion van docking --------------------------------------------------------------------------
// #region update — the entire simulation, in one function -----------------------------------------
let skyOff = 0;

function update(dt) {
  G.time += dt;
  G.pz = G.playerZ; G.px = G.playerX;   // snapshot for render interpolation
  const speedPct = G.speed / CFG.maxSpeed;

  if (G.state === "title") {
    // attract mode: ghost-drive the road
    G.speed = lerp(G.speed, 42, dt);
    G.playerZ += G.speed * dt;
    const seg = segAt(G.playerZ + CFG.segLen * 4);
    G.playerX = lerp(G.playerX, clamp(-seg.curve * 0.8, -3.5, 3.5), dt * 0.8);
    skyOff += segAt(G.playerZ).curve * speedPct * dt * 0.02;
    updateParticles(dt);
    return;
  }
  if (G.state !== "play") { updateParticles(dt); return; }

  // #region boost -----------------------------------------------------------
  if (G.boost.active > 0) G.boost.active -= dt;
  if (input.joyBoost && !G.boostHeld) fireBoost();   // stick-up is an edge trigger
  G.boostHeld = input.joyBoost;

  // #endregion boost --------------------------------------------------------
  // #region speed / steering ------------------------------------------------
  const seg = segAt(G.playerZ + CFG.segLen * 2);
  const offroad = Math.abs(G.playerX) > CFG.roadHalfW - 0.3;
  const targetSpeed = (input.brake || input.joyBrake) ? 8 : offroad ? CFG.offroadMax
    : G.boost.active > 0 ? CFG.boostSpeed : CFG.maxSpeed;
  const rate = G.boost.active > 0 ? CFG.accel * 2.6 : CFG.accel;
  if (G.speed < targetSpeed) G.speed = Math.min(targetSpeed, G.speed + rate * dt);
  else G.speed = Math.max(targetSpeed, G.speed - CFG.brakePow * dt);

  const steerIn = clamp(((input.right ? 1 : 0) - (input.left ? 1 : 0)) + input.axis, -1, 1);
  G.steerVis = lerp(G.steerVis, steerIn, Math.min(1, dt * 8));
  G.playerX += G.steerVis * CFG.steerSpeed * dt * (0.35 + 0.65 * speedPct);
  G.playerX -= (dt * 2 * speedPct) * speedPct * seg.curve * CFG.centrifugal;
  G.playerX = clamp(G.playerX, -8.4, 8.4);
  if (offroad && G.speed > CFG.offroadMax + 2) G.shake = Math.min(G.shake + dt * 0.7, 0.5);

  G.playerZ += G.speed * dt;
  G.distance += G.speed * dt;
  G.score += G.speed * dt * 0.12;
  skyOff += seg.curve * speedPct * dt * 0.02;

  const newLevel = 1 + Math.floor(G.distance / 3500);
  if (newLevel > G.level) {
    G.level = newLevel;
    const ti = Math.min(newLevel - 1, CHASER_TIERS.length - 1);
    const tier = CHASER_TIERS[ti];
    announce("SECTOR " + newLevel, newLevel <= CHASER_TIERS.length
      ? "new hostile: " + tier.name + " — " + tierHint(tier)
      : tier.name + " pursuers, faster still", 2.6);
    AudioSys.sfx.vanNear();
  }

  // #endregion speed / steering ---------------------------------------------
  // #region spawning --------------------------------------------------------
  spawnAhead();
  G.chaserTimer -= dt;
  const maxChasers = Math.min(1 + Math.floor(G.level / 2), CFG.chaserMax);
  if (G.chaserTimer <= 0) {
    if (G.chasers.length < maxChasers) spawnChaser(rand(260, 330));
    G.chaserTimer = Math.max(4.5, 11 - G.level * 0.8) * rand(0.8, 1.2);
  }
  G.vanTimer -= dt;
  if (G.vanTimer <= 0 && !G.van) spawnVan();
  // supply trucks: the counterplay pipeline — first one early, then steady
  G.truckTimer -= dt;
  if (G.truckTimer <= 0) {
    spawnTruck();
    G.truckTimer = rand(20, 30);
  }

  // #endregion spawning -----------------------------------------------------
  // #region cars ahead ------------------------------------------------------
  for (let i = G.cars.length - 1; i >= 0; i--) {
    const c = G.cars[i];
    c.pz = c.z; c.px = c.x;
    if (c.dead) {
      c.spin += dt * 9;
      c.x += c.spinDir * dt * 9;
      c.z += c.speed * 0.5 * dt;
      if (c.spin > 9) { if (c === G.van) G.van = null; G.cars.splice(i, 1); }
      continue;
    }
    c.z += c.speed * dt;
    c.wob += dt;
    // enemies drift between lanes to block
    if (c.type === "enemy") {
      c.laneTimer -= dt;
      if (c.laneTimer <= 0) {
        c.baseX = clamp(c.baseX + choice([-CFG.laneW, CFG.laneW]), -CFG.laneW, CFG.laneW);
        c.laneTimer = rand(4, 9);
      }
    }
    // supply trucks wander slowly too, so they eventually cross your sights
    else if (c.type === "truck") {
      c.laneTimer -= dt;
      if (c.laneTimer <= 0) {
        c.baseX = clamp(c.baseX + choice([-CFG.laneW, CFG.laneW]), -CFG.laneW, CFG.laneW);
        c.laneTimer = rand(5, 9);
      }
    }
    c.x = lerp(c.x, c.baseX, Math.min(1, dt * 0.8)) + Math.sin(c.wob * 1.3) * 0.15;

    const dz = c.z - G.playerZ;
    // supply truck proximity callout
    if (c.type === "truck" && !c.warned && dz < 420) {
      c.warned = true;
      announce("GREEN SUPPLY TRUCK AHEAD", "shoot it — it drops a power-up", 2.6);
      AudioSys.sfx.vanNear();
    }
    // van docking / passing
    if (c === G.van) {
      if (dz < 260 && !G.vanWarned) { G.vanWarned = true; announce("WEAPONS VAN AHEAD", "pull up behind it to dock", 2.2); AudioSys.sfx.vanNear(); }
      if (dz < 9 && dz > -3 && Math.abs(c.x - G.playerX) < 2.1) {
        dockVan();
        G.van = null;
        G.cars.splice(i, 1);
        G.vanTimer = CFG.vanInterval * rand(0.9, 1.15);
        continue;
      }
      if (dz < -6) {
        announce("VAN MISSED", "next one soon", 1.6);
        G.van = null;
        G.cars.splice(i, 1);
        G.vanTimer = CFG.vanInterval * 0.5;
        continue;
      }
    } else if (dz < -25) {
      // passed cars leave play; enemies may swing in behind you
      if (c.type === "enemy" && G.chasers.length < maxChasers && Math.random() < 0.35) {
        spawnChaser(240);
        announce("CONTACT BEHIND", "check your mirror", 1.8);
      }
      G.cars.splice(i, 1);
      continue;
    }
    // collision with player
    if (dz < 7.5 && dz > -2 && Math.abs(c.x - G.playerX) < 1.9) {
      G.armor -= c.type === "civ" ? 22 : 13;
      G.speed *= 0.42;
      G.shake = 1; G.dmgFlash = 1;
      AudioSys.sfx.crash();
      killCar(c, "crash");
      if (c.type === "civ") announce("CIVILIAN COLLISION", "-300  armor critical", 2.0);
      else announce("RAMMED", "watch the road", 1.4);
    }
  }

  // #endregion cars ahead ---------------------------------------------------
  // #region machine guns ----------------------------------------------------
  // continuous target lock — the driver sees what's in the sights BEFORE firing
  G.lastAim = findGunTarget();
  G.gunCd -= dt;
  G.muzzle = Math.max(0, G.muzzle - dt);
  if (input.fire && G.gunCd <= 0) {
    G.gunCd = CFG.gunCooldown;
    G.muzzle = 0.085;                 // outlives most of the cooldown so tracers read as a stream
    G.gunSide = -G.gunSide;           // alternate barrels — classic machine-gun strobe
    G.shake = Math.min(G.shake + 0.035, 0.14);
    G.hasFired = true;
    AudioSys.sfx.gun();
    const target = G.lastAim;
    if (target) {
      target.hp -= CFG.gunDmg;
      spawnSparks(target.x, segY(target.z) + 0.8, target.z);
      AudioSys.sfx.hit();
      if (target.hp <= 0) killCar(target, "gun");
    }
  }

  // #endregion machine guns -------------------------------------------------
  // #region missiles --------------------------------------------------------
  for (let i = G.missiles.length - 1; i >= 0; i--) {
    const m = G.missiles[i];
    m.pz = m.z; m.px = m.x;
    m.t += dt;
    m.z += m.speed * dt;
    if (m.target && !m.target.dead) {
      m.x += (m.target.x - m.x) * Math.min(1, dt * 6.5);
      m.z = Math.min(m.z, m.target.z); // don't overshoot a locked target
    }
    if (Math.random() < 0.75) {
      G.particles.push({
        wx: m.x, wy: segY(m.z) + 0.7, wz: m.z - 3,
        vx: rand(-0.5, 0.5), vy: rand(0.2, 1.2), vz: -6,
        life: rand(0.25, 0.5), t: 0, size: rand(0.15, 0.4), color: "#c9c9c9",
      });
    }
    let hit = null;
    for (const c of G.cars) {
      if (c.dead || c.type === "van") continue; // van is friendly
      const dz = c.z - m.z;
      if (Math.abs(dz) < 7 && Math.abs(c.x - m.x) < 2.1) { hit = c; break; }
    }
    if (hit) {
      const cause = m.target ? "seeker" : "missile";
      killCar(hit, cause);
      for (const c of G.cars) {  // splash
        if (c !== hit && !c.dead && c.type !== "van" && Math.abs(c.z - hit.z) < 16 && Math.abs(c.x - hit.x) < 2.6) killCar(c, cause);
      }
      G.shake = Math.min(G.shake + 0.3, 1);
      G.missiles.splice(i, 1);
      continue;
    }
    if (m.z - G.playerZ > 800 || (m.target && m.target.dead)) G.missiles.splice(i, 1);
  }

  // #endregion missiles -----------------------------------------------------
  // #region smoke -----------------------------------------------------------
  if (G.smoke.active > 0) G.smoke.active -= dt;
  if (G.smoke.cooldown > 0) G.smoke.cooldown -= dt;

  // #endregion smoke --------------------------------------------------------
  // #region supply pickups (from destroyed trucks) --------------------------
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    p.pz = p.z; p.t += dt;
    const dz = p.z - G.playerZ;
    if (dz < -18) { G.pickups.splice(i, 1); continue; }      // drove past it
    if (dz < 5 && Math.abs(p.x - G.playerX) < 2.4) {
      applyDrop(p.kind);
      G.pickups.splice(i, 1);
    }
  }

  // #endregion supply pickups (from destroyed trucks) -----------------------
  // #region oil slicks ------------------------------------------------------
  for (let i = G.slicks.length - 1; i >= 0; i--) {
    const s = G.slicks[i];
    s.pd = s.dist;
    s.t -= dt;
    s.dist += G.speed * dt;      // we drive away from it; pursuers run onto it
    if (s.t <= 0 || s.dist > 170) { G.slicks.splice(i, 1); continue; }
    for (const ch of G.chasers) {
      if (ch.state !== "spinout" && s.dist >= ch.dist - 2 && Math.abs(s.x - ch.x) < 2.6) {
        G.slicks.splice(i, 1);
        ch.oilHp = (ch.oilHp === undefined ? 1 : ch.oilHp) - 1;
        if (ch.oilHp > 0) {
          // armored — slides wide and drops back, but keeps coming
          ch.dist += 20; ch.speed = Math.max(18, ch.speed * 0.7); ch.fireCd += 1.6;
          announce("ARMORED PURSUER", ch.oilHp + " more slick" + (ch.oilHp > 1 ? "s" : "") + " to spin him", 1.8);
          AudioSys.sfx.hit();
        } else {
          ch.state = "spinout"; ch.spin = 0.01;
          G.score += 200; G.kills++;
          announce("PURSUER SPUN OUT", "+200", 1.8);
          AudioSys.sfx.spinout();
        }
        break;
      }
    }
  }

  // #endregion oil slicks ---------------------------------------------------
  // #region chasers ---------------------------------------------------------
  const smoked = G.smoke.active > 0;
  for (let i = G.chasers.length - 1; i >= 0; i--) {
    const ch = G.chasers[i];
    ch.pd = ch.dist; ch.px = ch.x;
    ch.muzzle = Math.max(0, ch.muzzle - dt);
    ch.wob += dt;
    if (ch.state === "spinout") {
      ch.spin += dt * 11;
      ch.dist += dt * (26 + ch.spin * 5);
      ch.x += Math.sin(ch.spin) * dt * 6;
      if (ch.spin > 11 || ch.dist > 220) G.chasers.splice(i, 1);
      continue;
    }
    const smokeRes = ch.tier ? ch.tier.smokeResist : 0;
    if (smoked && ch.dist < 100) ch.blindT = G.smoke.active * (1 - smokeRes); // caught in the cloud
    const isSmoked = (ch.blindT || 0) > 0;
    if (isSmoked) {
      // blinded: hard shove back on the hit, then keeps tumbling back until the
      // smoke clears — higher tiers shrug off part of it (smokeResist)
      ch.blindT -= dt;
      if (!ch.smoked) { ch.smoked = true; ch.dist += 45 * (1 - smokeRes); ch.speed = Math.max(18, ch.speed * (0.55 + smokeRes * 0.45)); }
      ch.dist += (G.speed * 0.8 + 16) * (1 - smokeRes) * dt;
      ch.x = clamp(ch.x + Math.sin(ch.wob * 2.2) * dt * 3, -5, 5);
    } else {
      ch.smoked = false;
      // pursuit physics: the chaser has its own speed and WEAK brakes (~14 m/s²) vs the
      // Interceptor's 58 m/s² — brake hard with one glued to your tail and he overshoots,
      // popping out ahead of you as a regular (shootable) enemy car (George, 2026-11-07).
      const want = ch.dist > 30 ? G.speed + 9 + G.level * 0.4 + (ch.speedBonus || 0) : G.speed;
      ch.speed += clamp(want - ch.speed, -14 * dt, 20 * dt);
      if (ch.maxSpeed) ch.speed = Math.min(ch.speed, ch.maxSpeed);
      ch.dist -= (ch.speed - G.speed) * dt;
      if (ch.dist < -4) {
        const oc = { z: G.playerZ + 8, x: clamp(ch.x, -4.5, 4.5), baseX: clamp(ch.x, -4.5, 4.5), speed: Math.max(ch.speed, 30), type: "enemy", hp: CFG.enemyHp + (ch.tier ? ch.tier.hpBonus : 0), spr: "enemyR" + (ch.tierIdx || 0), dead: false, spin: 0, spinDir: 1, wob: rand(0, 6.28), laneTimer: rand(3, 6) };
        oc.pz = oc.z; oc.px = oc.x;
        G.cars.push(oc);
        G.chasers.splice(i, 1);
        announce("PURSUER OVERRAN", "he's ahead — take the shot", 2.2);
        AudioSys.sfx.spinout();
        continue;
      } else if (ch.dist < 1.5 && Math.abs(ch.speed - G.speed) < 2) {
        ch.dist = 1.5; ch.speed = G.speed; // matched pace, glued to your bumper —
      }                                     // brake hard and the clamp releases, so he overshoots
      ch.x = clamp(lerp(ch.x, clamp(G.playerX, -4.5, 4.5), dt * 0.55), -5, 5);
      // fire at the player
      if (ch.dist < 28) {
        ch.fireCd -= dt;
        if (ch.fireCd <= 0) {
          ch.fireCd = rand(0.85, 1.45) * Math.max(0.55, 1 - G.level * 0.04);
          ch.muzzle = 0.09;
          G.armor -= rand(3, 5) + G.level * 0.4;
          G.dmgFlash = Math.min(1, G.dmgFlash + 0.55);
          G.shake = Math.min(1, G.shake + 0.35);
          AudioSys.sfx.damage();
        }
      }
    }
    if (ch.dist > 330) {
      G.chasers.splice(i, 1);
      G.score += 50;
      announce("PURSUER LOST", "+50", 1.4);
    }
  }

  // #endregion chasers ------------------------------------------------------
  // #region armor / game over -----------------------------------------------
  G.armor = clamp(G.armor, 0, 100);
  if (G.armor <= 0) {
    G.state = "over";
    AudioSys.music(false);
    AudioSys.engine(0, false);
    AudioSys.sfx.bigExplosion();
    G.shake = 1;
    if (Math.floor(G.score) > G.hi) { G.hi = Math.floor(G.score); }
    saveStore();
  }

  updateParticles(dt);
  G.shake = Math.max(0, G.shake - dt * 1.8);
  G.dmgFlash = Math.max(0, G.dmgFlash - dt * 2.2);
  for (let i = G.announce.length - 1; i >= 0; i--) {
    G.announce[i].t -= dt;
    if (G.announce[i].t <= 0) G.announce.splice(i, 1);
  }
  AudioSys.engine(speedPct, true);
  // #endregion armor / game over --------------------------------------------

}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.t += dt;
    if (p.t >= p.life) { G.particles.splice(i, 1); continue; }
    p.wx += p.vx * dt; p.wy += p.vy * dt; p.wz += p.vz * dt;
    p.vy -= 22 * dt;
    if (p.wy < segY(p.wz)) { p.wy = segY(p.wz); p.vy *= -0.4; }
  }
}
// #endregion update -------------------------------------------------------------------------------
// #region rendering — projection, sky, ridges, drawWorld() ----------------------------------------
// Everything draws into a small offscreen buffer, then blits upscaled with
// smoothing disabled — that low-res buffer IS the 8-16 bit pixel aesthetic,
// and it cheapens fill rate on mobile GPUs as a bonus.
const vctx = canvas.getContext("2d");
const buf = makeCanvas(427, 240);
const ctx = buf.getContext("2d");
const mirrorCanvas = makeCanvas(360, 132);
const mctx = mirrorCanvas.getContext("2d");
const pts = [];               // per-slice projection cache
let camDepth = 1.15;

const RIDGE_A = [], RIDGE_B = [];
(() => {
  const r = mulberry32(1983);
  for (let i = 0; i < 72; i++) RIDGE_A.push(0.3 + r() * 0.7);
  for (let i = 0; i < 72; i++) RIDGE_B.push(0.2 + r() * 0.8);
})();

function horizonY() { return H * 0.38; }
function horizonShift() { return horizonY() - H / 2; }   // negative: world shifts up

function boostEase() {
  return G.boost.active > 0 ? Math.min(1, G.boost.active / (CFG.boostDuration * 0.6)) : 0;
}
function buildRoad(camY, rz, rx) {
  pts.length = 0;
  const baseMod = rz % CFG.segLen;
  const baseSeg = segAt(rz);
  const zoom = 1 - 0.16 * boostEase();      // FOV widens while lit — speed rush
  let x = 0, dx = -baseSeg.curve * (baseMod / CFG.segLen);
  for (let n = 0; n <= CFG.drawDist; n++) {
    const s = segAt(rz + n * CFG.segLen);
    const relZ = n * CFG.segLen - baseMod;
    x += dx; dx += s.curve;
    const scale = (camDepth * zoom) / Math.max(relZ, 0.001);
    pts.push({
      x: W / 2 + scale * (x - rx) * (W / 2),
      y: H / 2 - scale * (s.y - camY) * (H / 2),
      w: scale * CFG.roadHalfW * (W / 2),
      scale, relZ, curve: s.curve, clip: H * 2, sprites: s.sprites,
    });
  }
}

function quad(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

function drawSky(hy) {
  // banded dusk sky — hard color strips, no gradients (16-bit convention)
  const bands = ["#150c28", "#251339", "#3a1a48", "#552450", "#753352",
                 "#9c4749", "#c1633a", "#e58a40", "#f7a954"];
  const bh = hy / (bands.length - 1);
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + (i === bands.length - 1 ? 2 : 0));
  }
  // sun: stacked chunky discs, sinking into the horizon
  const sunX = W * 0.5 - (skyOff % 1) * W * 0.1;
  const sunY = hy - H * 0.018;
  ctx.fillStyle = "#e07a3a";
  ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.085, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffb050";
  ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.068, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd88f";
  ctx.beginPath(); ctx.arc(sunX, sunY - H * 0.008, H * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff0bd";
  ctx.fillRect(sunX - H * 0.02, sunY - H * 0.03, H * 0.04, H * 0.02);
  // mountain ridges (parallax with road curvature)
  drawRidge(RIDGE_A, hy - 1, H * 0.075, "#4a2447", skyOff * 0.4);
  drawRidge(RIDGE_B, hy + 1, H * 0.115, "#331936", skyOff * 0.9);
  // desert floor
  ctx.fillStyle = "#9c6a3c";
  ctx.fillRect(0, hy, W, H - hy);
}
function drawRidge(heights, baseY, amp, color, off) {
  const step = W / 36;
  const shift = ((off % 1) + 1) % 1;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-step * 2, baseY);
  for (let i = -2; i <= 40; i++) {
    const idx = ((i + Math.floor(shift * 36) % 72) + 72) % 72;
    const frac = (shift * 36) % 1;
    const h0 = heights[idx], h1 = heights[(idx + 1) % 72];
    ctx.lineTo(i * step - frac * step, baseY - lerp(h0, h1, frac) * amp);
  }
  ctx.lineTo(W + step * 2, baseY);
  ctx.closePath(); ctx.fill();
}

function spriteFor(car) {
  if (Sprites[car.spr]) return Sprites[car.spr];
  return Sprites.civs[parseInt(car.spr.slice(3), 10) % Sprites.civs.length];
}

const carBuckets = [];
function drawWorld(camY, rz, rx, alpha) {
  const shift = horizonShift();
  ctx.save();
  ctx.translate(0, shift);
  buildRoad(camY, rz, rx);

  // bucket dynamic entities by slice (interpolated render positions)
  carBuckets.length = 0;
  const baseMod = rz % CFG.segLen;
  for (const c of G.cars) {
    c._rz = lerp(c.pz ?? c.z, c.z, alpha);
    c._rx = lerp(c.px ?? c.x, c.x, alpha);
    const rel = c._rz - rz + baseMod;
    const n = Math.floor(rel / CFG.segLen);
    if (n < 1 || n >= CFG.drawDist) continue;
    (carBuckets[n] || (carBuckets[n] = [])).push(c);
  }
  const missileBuckets = [];
  for (const m of G.missiles) {
    m._rz = lerp(m.pz ?? m.z, m.z, alpha);
    m._rx = lerp(m.px ?? m.x, m.x, alpha);
    const rel = m._rz - rz + baseMod;
    const n = Math.floor(rel / CFG.segLen);
    if (n < 1 || n >= CFG.drawDist) continue;
    (missileBuckets[n] || (missileBuckets[n] = [])).push(m);
  }
  const pickupBuckets = [];
  for (const p of G.pickups) {
    p._rz = lerp(p.pz ?? p.z, p.z, alpha);
    const rel = p._rz - rz + baseMod;
    const n = Math.floor(rel / CFG.segLen);
    if (n < 1 || n >= CFG.drawDist) continue;
    (pickupBuckets[n] || (pickupBuckets[n] = [])).push(p);
  }

  const baseSegIdx = Math.floor(rz / CFG.segLen);
  let maxy = H - shift;   // screen bottom in translated coords

  // near-road fill: the nearest segment anchor sits 0-10m ahead and wraps with
  // baseMod, so the road's bottom edge used to snap back up-screen ~6x/sec at top
  // speed — the jerky patch in front of the windshield (George, 2026-11-07).
  // Road edges are linear in scale space, so extrapolate from the two nearest
  // valid anchors and fill solid asphalt (+ rumble) down past the frame.
  {
    let a = pts[1], b = pts[2];
    if (!a || a.relZ <= camDepth) { a = pts[2]; b = pts[3]; }
    if (a && b && a.relZ > camDepth && a.y - b.y > 0.001) {
      const yT = H - shift + 50;              // comfortably below the visible bottom
      const t = (yT - a.y) / (a.y - b.y);
      if (t > 0) {
        const xT = a.x + t * (a.x - b.x), wT = a.w + t * (a.w - b.w);
        quad(a.x - a.w * 1.13, a.y, a.x + a.w * 1.13, a.y,
             xT + wT * 1.13, yT, xT - wT * 1.13, yT, "#b03030");
        quad(a.x - a.w, a.y, a.x + a.w, a.y,
             xT + wT, yT, xT - wT, yT, "#53535b");
      }
    }
  }

  for (let n = CFG.drawDist - 1; n > 0; n--) {
    const p1 = pts[n], p2 = pts[n + 1];
    p1.clip = maxy;
    if (p1.relZ <= camDepth || p2.y > maxy) continue;
    // beyond n=90 the 1-2px alternating bands just moire — go solid
    const parity = ((baseSegIdx + n) >> 1) % 2 === 0 && n < 90;

    // ground band
    ctx.fillStyle = parity ? "#a5713f" : "#9c6a3c";
    ctx.fillRect(0, p2.y, W, p1.y - p2.y);
    // rumble
    quad(p1.x - p1.w * 1.13, p1.y, p1.x + p1.w * 1.13, p1.y,
         p2.x + p2.w * 1.13, p2.y, p2.x - p2.w * 1.13, p2.y,
         parity ? "#b03030" : "#ddd5c5");
    // road — solid gray: the alternating parity bands flipped color in place each
    // segment crossing, which read as a jerky patch right in front of the
    // windshield where bands are tallest (George, 2026-11-07)
    quad(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y,
         p2.x + p2.w, p2.y, p2.x - p2.w, p2.y,
         "#53535b");
    // lane dashes (near/mid only — at the horizon they're subpixel shimmer)
    if (n < 90 && (baseSegIdx + n) % 8 < 4) {
      for (const off of [-CFG.laneW / 2, CFG.laneW / 2]) {
        const lw1 = Math.max(1, p1.scale * 0.09 * (W / 2));
        const lw2 = Math.max(1, p2.scale * 0.09 * (W / 2));
        const c1 = p1.x + off * p1.scale * (W / 2);
        const c2 = p2.x + off * p2.scale * (W / 2);
        quad(c1 - lw1, p1.y, c1 + lw1, p1.y, c2 + lw2, p2.y, c2 - lw2, p2.y, "#cfc9b0");
      }
    }
    // dusk haze with distance (kept thin — George: far view was too muddy)
    const fog = Math.pow(n / CFG.drawDist, 2) * 0.32;
    if (fog > 0.02) {
      ctx.fillStyle = "rgba(216,140,88," + fog.toFixed(3) + ")";
      ctx.fillRect(0, p2.y, W, p1.y - p2.y);
    }

    // roadside sprites
    const clip = maxy;
    if (p1.sprites.length) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -3000, W, clip + 3000); ctx.clip();
      for (const sp of p1.sprites) {
        const img = Sprites[sp.spr];
        const worldH = sp.spr === "cactus" ? 3.9 : sp.spr === "sign" ? 3.1 : 1.5;
        const dh = p1.scale * worldH * (W / 2);
        const dw = dh * (img.width / img.height);
        const sx = p1.x + sp.off * CFG.roadHalfW * p1.scale * (W / 2);
        if (sx + dw < 0 || sx - dw > W) continue;
        ctx.drawImage(img, sx - dw / 2, p1.y - dh, dw, dh);
      }
      ctx.restore();
    }
    // cars on this slice
    const bucket = carBuckets[n];
    if (bucket) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -3000, W, clip + 3000); ctx.clip();
      const fracBase = baseMod / CFG.segLen;
      for (const c of bucket) {
        const frac = ((c._rz - rz) / CFG.segLen + fracBase) % 1;
        const sx = lerp(p1.x, p2.x, frac) + c._rx * lerp(p1.scale, p2.scale, frac) * (W / 2);
        const sy = lerp(p1.y, p2.y, frac);
        const sc = lerp(p1.scale, p2.scale, frac);
        const img = spriteFor(c);
        const worldW = c.type === "van" ? 2.6 : c.type === "truck" ? 2.5 : 2.05;
        const farBoost = 1 + (n / CFG.drawDist) * 0.5;
        const dw = sc * worldW * (W / 2) * farBoost;
        const dh = dw * (img.height / img.width);
        ctx.save();
        ctx.translate(sx, sy - dh / 2);
        if (c.dead) ctx.rotate(Math.sin(c.spin * 2.2) * 0.9);
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();
      }
      ctx.restore();
    }
    // missiles on this slice
    const mbucket = missileBuckets[n];
    if (mbucket) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -3000, W, clip + 3000); ctx.clip();
      for (const m of mbucket) {
        const sc = p1.scale;
        const sx = p1.x + m._rx * sc * (W / 2);
        const sy = p1.y - sc * 0.7 * (H / 2);
        const len = Math.max(2, sc * 1.1 * (W / 2));
        ctx.strokeStyle = "#ffdf9e";
        ctx.lineWidth = Math.max(1, len * 0.22);
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + len); ctx.stroke();
        ctx.fillStyle = "#fff3c9";
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, len * 0.16), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    // supply pickups on this slice — glowing bobbing icons you drive through
    const pbucket = pickupBuckets[n];
    if (pbucket) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -3000, W, clip + 3000); ctx.clip();
      for (const p of pbucket) {
        const sc = p1.scale;
        const sx = p1.x + p.x * sc * (W / 2);
        const bob = Math.sin(G.time * 4 + p.bob) * sc * 0.12 * (H / 2);
        const sy = p1.y - sc * 0.55 * (H / 2) + bob;
        const pr = Math.max(2.5, sc * 0.42 * (W / 2));
        const col = p.kind === "smoke" ? "#7fe0ff" : p.kind === "boost" ? "#ff7a2e" : p.kind === "oil" ? "#c9c9de" : p.kind === "missiles" ? "#ffb02e" : "#6fdc73";
        const pulse = 0.75 + 0.25 * Math.sin(G.time * 6 + p.bob);
        // outer glow
        ctx.globalAlpha = 0.35 * pulse;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(sx, sy, pr * 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        // dark disc + colored ring
        ctx.fillStyle = "rgba(10,10,16,0.9)";
        ctx.beginPath(); ctx.arc(sx, sy, pr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(1.5, pr * 0.22);
        ctx.stroke();
        // glyph
        ctx.fillStyle = col;
        ctx.font = "bold " + Math.max(6, Math.round(pr * 1.1)) + "px 'Courier New', monospace";
        ctx.textAlign = "center";
        const glyph = p.kind === "smoke" ? "S" : p.kind === "boost" ? "B" : p.kind === "oil" ? "O" : p.kind === "missiles" ? "M" : "+";
        ctx.fillText(glyph, sx, sy + pr * 0.38);
        ctx.textAlign = "left";
      }
      ctx.restore();
    }
    maxy = p1.y;
  }

  // world particles (explosions, sparks, missile smoke)
  ctx.save();
  for (const p of G.particles) {
    const relZ = p.wz - rz;
    if (relZ < 1 || relZ > CFG.drawDist * CFG.segLen) continue;
    const scale = camDepth / relZ;
    const n = clamp(Math.floor((relZ + baseMod) / CFG.segLen), 1, pts.length - 1);
    const sx = pts[n].x + p.wx * scale * (W / 2);
    const sy = H / 2 - scale * (p.wy - camY) * (H / 2);
    const r = Math.max(0.6, scale * p.size * (W / 2) * (1 - p.t / p.life * 0.5));
    ctx.globalAlpha = 1 - (p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // boost speed lines — radial streaks while lit
  const be = boostEase();
  if (be > 0.05) {
    ctx.strokeStyle = "rgba(255,220,170," + (0.38 * be).toFixed(3) + ")";
    ctx.lineWidth = Math.max(1, H * 0.006);
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + G.time * 0.7;
      const r0 = H * (0.30 + 0.08 * Math.sin(i * 3.7));
      const r1 = r0 + H * 0.24 * be;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * r0 * 1.7, H / 2 + Math.sin(a) * r0 * 0.8);
      ctx.lineTo(W / 2 + Math.cos(a) * r1 * 1.7, H / 2 + Math.sin(a) * r1 * 0.8);
      ctx.stroke();
    }
  }

  ctx.restore(); // un-translate
}
// #endregion rendering ----------------------------------------------------------------------------
// #region mirror view — the rearview-mirror renderer ----------------------------------------------
// Maps "meters behind" to mirror y/scale: chasers, smoke, oil all live here.
function mirrorMap(d) {
  d = Math.max(2.5, d);
  const t = 1 - Math.exp(-d / 140);
  return { t, scale: 1 - t };
}
function renderMirror(rz, alpha) {
  const g = mctx, MW = mirrorCanvas.width, MH = mirrorCanvas.height;
  const my = MH * 0.40;                       // mirror horizon
  const curve = segAt(rz + CFG.segLen * 2).curve;
  const skew = -curve * 4;

  const sky = g.createLinearGradient(0, 0, 0, my);
  sky.addColorStop(0, "#150c26");
  sky.addColorStop(0.7, "#47204a");
  sky.addColorStop(1, "#8a4038");
  g.fillStyle = sky; g.fillRect(0, 0, MW, my + 1);
  g.fillStyle = "#6e4c30"; g.fillRect(0, my, MW, MH - my);

  // road receding
  const cxN = MW / 2 + skew;                  // near center
  const cxF = MW / 2 + skew * 3.2;            // far center (bends with curve)
  g.fillStyle = "#3a3a42";
  g.beginPath();
  g.moveTo(cxN - MW * 0.30, MH); g.lineTo(cxN + MW * 0.30, MH);
  g.lineTo(cxF + 1.5, my); g.lineTo(cxF - 1.5, my);
  g.closePath(); g.fill();
  // rumble edges + moving lane dashes (sense of speed in the mirror)
  g.strokeStyle = "#b9a08a"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cxN - MW * 0.30, MH); g.lineTo(cxF - 1.5, my); g.stroke();
  g.beginPath(); g.moveTo(cxN + MW * 0.30, MH); g.lineTo(cxF + 1.5, my); g.stroke();
  g.fillStyle = "#cfc9b0";
  for (let d = 4; d < 300; d += 9) {
    if (Math.floor((d + rz) / 9) % 2 === 0) continue;
    const { t, scale } = mirrorMap(d);
    const y = MH - t * (MH - my);
    const cx = lerp(cxN, cxF, t);
    const off = MW * 0.30 * scale * (CFG.laneW / 2 / CFG.roadHalfW);
    const dw = Math.max(1, 3.5 * scale), dh = Math.max(1, 4 * scale);
    g.fillRect(cx - off - dw / 2, y - dh, dw, dh);
    g.fillRect(cx + off - dw / 2, y - dh, dw, dh);
  }

  // oil slicks on the road behind
  for (const s of G.slicks) {
    const sd = lerp(s.pd ?? s.dist, s.dist, alpha);
    const { t, scale } = mirrorMap(sd);
    const y = MH - t * (MH - my);
    const cx = lerp(cxN, cxF, t) + s.x * 20 * scale;
    const w = Math.max(3, MW * 0.11 * scale);
    g.fillStyle = "rgba(8,8,12,0.9)";
    g.beginPath(); g.ellipse(cx, y, w, w * 0.26, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(140,140,170,0.35)";
    g.beginPath(); g.ellipse(cx - w * 0.2, y - w * 0.05, w * 0.4, w * 0.09, 0, 0, Math.PI * 2); g.fill();
  }

  // chasers, far to near
  const sorted = G.chasers.slice().sort((a, b) => b.dist - a.dist);
  const smokeOn = G.smoke.active > 0;
  for (const ch of sorted) {
    const cd = lerp(ch.pd ?? ch.dist, ch.dist, alpha);
    const cx2 = lerp(ch.px ?? ch.x, ch.x, alpha);
    const { t, scale } = mirrorMap(cd);
    const y = MH - t * (MH - my);
    const cx = lerp(cxN, cxF, t) + cx2 * 20 * scale;
    const w = Math.max(3, MW * 0.235 * scale);
    const h = w;
    g.save();
    g.translate(cx, y - h * 0.45);
    if (ch.state === "spinout") g.rotate(Math.sin(ch.spin * 2) * 0.9);
    if (smokeOn && cd < 100) g.globalAlpha = 0.4;
    g.drawImage(Sprites["chaserF" + (ch.tierIdx || 0)] || Sprites.enemyFront, -w / 2, -h / 2, w, h);
    if (ch.muzzle > 0) {
      g.globalAlpha = 1;
      g.fillStyle = "#ffe98a";
      g.beginPath(); g.arc(w * 0.28, -h * 0.05, Math.max(2, w * 0.08), 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  // smoke cloud billowing out behind us
  if (smokeOn) {
    const life = G.smoke.active / CFG.smokeDuration;
    for (let d = 10; d < 110; d += 11) {
      const { t, scale } = mirrorMap(d);
      const y = MH - t * (MH - my);
      const cx = lerp(cxN, cxF, t) + Math.sin(d * 1.7 + G.time * 3) * 10 * scale;
      const r = (9 + d * 0.38) * (0.7 + (1 - life) * 0.6);
      g.fillStyle = "rgba(190,190,200," + (0.32 * (1 - d / 130) * Math.min(1, life * 3)).toFixed(3) + ")";
      g.beginPath(); g.arc(cx, y, r, 0, Math.PI * 2); g.fill();
    }
  }

  // glass sheen
  const sheen = g.createLinearGradient(0, 0, MW, MH);
  sheen.addColorStop(0, "rgba(255,255,255,0.07)");
  sheen.addColorStop(0.4, "rgba(255,255,255,0.015)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sheen; g.fillRect(0, 0, MW, MH);
}

// #endregion mirror view --------------------------------------------------------------------------
// #region cockpit — dash, A-pillars, steering wheel -----------------------------------------------
function drawCockpit(rz, rx) {
  const dashTop = H * 0.78;
  // dashboard
  const dg = ctx.createLinearGradient(0, dashTop, 0, H);
  dg.addColorStop(0, "#26272e");
  dg.addColorStop(0.25, "#1a1b21");
  dg.addColorStop(1, "#0c0d11");
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.moveTo(0, dashTop + H * 0.03);
  ctx.quadraticCurveTo(W / 2, dashTop - H * 0.035, W, dashTop + H * 0.03);
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();
  // dash top trim
  ctx.strokeStyle = "rgba(255,180,94,0.28)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, dashTop + H * 0.03);
  ctx.quadraticCurveTo(W / 2, dashTop - H * 0.035, W, dashTop + H * 0.03);
  ctx.stroke();
  // A-pillars
  ctx.fillStyle = "rgba(16,17,22,0.96)";
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W * 0.030, 0); ctx.lineTo(W * 0.075, dashTop); ctx.lineTo(0, dashTop + H * 0.03);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W, 0); ctx.lineTo(W * 0.970, 0); ctx.lineTo(W * 0.925, dashTop); ctx.lineTo(W, dashTop + H * 0.03);
  ctx.closePath(); ctx.fill();

  // steering wheel (center-seat interceptor)
  const wx = W / 2, wy = H * 1.10, wr = H * 0.30;
  ctx.save();
  ctx.translate(wx, wy);
  ctx.rotate(G.steerVis * 0.7 + segAt(rz + CFG.segLen * 2).curve * 0.05 * (G.speed / CFG.maxSpeed));
  ctx.strokeStyle = "#17181d";
  ctx.lineWidth = H * 0.052;
  ctx.beginPath(); ctx.arc(0, 0, wr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "#2c2d34";
  ctx.lineWidth = H * 0.030;
  ctx.beginPath(); ctx.arc(0, 0, wr, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#22232a";
  for (const a of [Math.PI / 2, Math.PI / 2 + 2.1, Math.PI / 2 - 2.1]) {
    ctx.save(); ctx.rotate(a);
    roundRect(ctx, -H * 0.018, -wr, H * 0.036, wr, H * 0.014); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, H * 0.075, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffb45e";
  ctx.beginPath(); ctx.arc(0, 0, H * 0.016, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // gun ports + muzzle flashes
  const mPct = G.muzzle > 0 ? G.muzzle / 0.085 : 0;
  for (const s of [-1, 1]) {
    const gx = W / 2 + s * W * 0.045, gy = dashTop + H * 0.012;
    ctx.fillStyle = "#0a0b0e";
    ctx.beginPath(); ctx.arc(gx, gy, H * 0.011, 0, Math.PI * 2); ctx.fill();
    if (mPct > 0) {
      // firing barrel gets the big burst, other barrel a smaller echo
      const main = s === G.gunSide ? 1 : 0.45;
      const fr = H * (0.030 + 0.022 * mPct) * main;
      const fy = gy - H * 0.014;
      ctx.globalAlpha = mPct * main;
      ctx.fillStyle = "#ff9a3c";
      ctx.beginPath(); ctx.arc(gx, fy, fr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff3c0";
      ctx.beginPath(); ctx.arc(gx, fy, fr * 0.55, 0, Math.PI * 2); ctx.fill();
      // starburst spikes
      ctx.strokeStyle = "#ffe98a";
      ctx.lineWidth = Math.max(2, H * 0.008);
      for (let k = 0; k < 4; k++) {
        const a = -Math.PI / 2 + (k - 1.5) * 0.55 + rand(-0.1, 0.1);
        ctx.beginPath();
        ctx.moveTo(gx, fy);
        ctx.lineTo(gx + Math.cos(a) * fr * 2.1, fy + Math.sin(a) * fr * 2.1);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  // tracers converge on the aim point
  if (G.muzzle > 0 && G.state === "play") {
    const aim = aimPoint(rz, rx);
    const jx = rand(-2, 2), jy = rand(-2, 2);
    for (const s of [-1, 1]) {
      const gx = W / 2 + s * W * 0.045;
      const hot = s === G.gunSide;
      // wide glow under a bright core
      ctx.strokeStyle = hot ? "rgba(255,140,50,0.55)" : "rgba(255,140,50,0.28)";
      ctx.lineWidth = Math.max(3, H * 0.012);
      ctx.beginPath(); ctx.moveTo(gx, dashTop); ctx.lineTo(aim.x + jx, aim.y + jy); ctx.stroke();
      ctx.strokeStyle = hot ? "rgba(255,240,190,0.95)" : "rgba(255,240,190,0.5)";
      ctx.lineWidth = Math.max(1.5, H * 0.005);
      ctx.beginPath(); ctx.moveTo(gx, dashTop); ctx.lineTo(aim.x + jx, aim.y + jy); ctx.stroke();
    }
    // impact flash where the rounds land
    if (G.lastAim && !G.lastAim.dead) {
      ctx.fillStyle = "rgba(255,230,160," + (0.9 * mPct).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(aim.x, aim.y, Math.max(3, H * 0.014) * (0.6 + mPct), 0, Math.PI * 2); ctx.fill();
    }
  }
}
function aimPoint(rz, rx) {
  const c = G.lastAim;
  if (c && !c.dead) {
    const relZ = (c._rz ?? c.z) - rz;
    if (relZ > 2) {
      const scale = camDepth / relZ;
      const n = clamp(Math.floor((relZ + rz % CFG.segLen) / CFG.segLen), 1, pts.length - 1);
      return {
        x: pts[n] ? pts[n].x + (c._rx ?? c.x) * scale * (W / 2) : W / 2,
        y: pts[n] ? pts[n].y + horizonShift() - scale * 0.8 * (H / 2) : horizonY(),
      };
    }
  }
  return { x: W / 2, y: horizonY() + H * 0.05 };
}

// #endregion cockpit ------------------------------------------------------------------------------
// #region crisp text queue: qtext() / flushText() — read before touching text --------------------
// All legible UI text is queued during the buffer render and drawn afterwards
// on the visible canvas at full resolution (George: "clean up ALL text in the
// game, not just the home screen", 2026-11-07). World-art glyphs (pickup
// letters, sprite decals) stay in the pixel buffer on purpose.
const TQ = [];
function qtext(str, x, y, size, o) {
  TQ.push({ str, x, y, size, color: o.color, align: o.align || "left",
    alpha: o.alpha === undefined ? 1 : o.alpha, weight: o.weight || "bold",
    glow: o.glow || null, glowBlur: o.glowBlur || 0, shadow: !!o.shadow });
}
function flushText() {
  if (!TQ.length) return;
  const sx = canvas.width / W, sy = canvas.height / H;
  for (const t of TQ) {
    vctx.globalAlpha = t.alpha;
    vctx.font = t.weight + " " + Math.max(2, Math.round(t.size * sy)) + "px 'Courier New', monospace";
    vctx.textAlign = t.align;
    if (t.shadow) {
      vctx.fillStyle = "rgba(16,6,10,0.9)";
      vctx.fillText(t.str, t.x * sx + 1, t.y * sy + 1);
    }
    if (t.glow) { vctx.shadowColor = t.glow; vctx.shadowBlur = Math.max(2, Math.round(t.glowBlur * sy)); }
    vctx.fillStyle = t.color;
    vctx.fillText(t.str, t.x * sx, t.y * sy);
    if (t.glow) vctx.shadowBlur = 0;
  }
  vctx.globalAlpha = 1;
  vctx.textAlign = "left";
  TQ.length = 0;
}

// #endregion crisp text queue ---------------------------------------------------------------------
// #region HUD — score, MPH, weapon chips, announcements -------------------------------------------
function drawHUD() {
  const amber = "#ffb45e";
  // score block
  qtext("SCORE " + String(Math.floor(G.score)).padStart(6, "0"), W * 0.018, H * 0.052, Math.round(H * 0.042), { color: amber, glow: "rgba(255,150,60,0.7)", glowBlur: Math.round(H * 0.012) });
  qtext("BEST  " + String(G.hi).padStart(6, "0"), W * 0.018, H * 0.082, Math.round(H * 0.028), { color: "rgba(255,180,94,0.65)", weight: "normal" });
  // sector
  qtext("SECTOR " + G.level, W * 0.895, H * 0.052, Math.round(H * 0.036), { color: amber, align: "right" });
  if (G.van) {
    qtext("VAN " + Math.max(0, Math.round(G.van.z - G.playerZ)) + "m", W * 0.895, H * 0.085, Math.round(H * 0.030), { color: "#7fe0ff", align: "right" });
  }

  // rear alert
  let threat = 0;
  for (const ch of G.chasers) if (ch.dist < 60 && ch.state !== "spinout") threat = Math.max(threat, 1 - ch.dist / 60);
  if (threat > 0) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 10);
    qtext("▲ TAIL ▲", W / 2, H * 0.175, Math.round(H * 0.034), { color: "rgba(255,70,60," + (0.4 + threat * 0.6 * blink).toFixed(2) + ")", align: "center" });
  }

  // speed readout
  const mph = Math.round(G.speed * 2.237);
  qtext(String(mph), W / 2, H * 0.845, Math.round(H * 0.075), { color: G.boost.active > 0 ? "#ff7a2e" : amber, align: "center", glow: "rgba(255,150,60,0.8)", glowBlur: Math.round(H * 0.018) });
  qtext("MPH", W / 2, H * 0.872, Math.round(H * 0.024), { color: "rgba(255,180,94,0.6)", align: "center", weight: "normal" });

  // armor bar
  const ax = W * 0.615, ay = H * 0.812, aw = W * 0.105, ah = H * 0.022;
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(ax, ay, aw, ah);
  const pct = G.armor / 100;
  ctx.fillStyle = pct > 0.5 ? "#6fdc73" : pct > 0.25 ? "#ffc44e" : "#ff5347";
  ctx.fillRect(ax + 1, ay + 1, (aw - 2) * pct, ah - 2);
  ctx.strokeStyle = "rgba(255,180,94,0.4)";
  ctx.strokeRect(ax, ay, aw, ah);
  qtext("ARMOR", ax - W * 0.006, ay + ah * 0.78, Math.round(H * 0.022), { color: "rgba(255,180,94,0.7)", align: "right", weight: "normal" });

  // weapon chips
  drawChip(W * 0.255, H * 0.830, "GUNS ∞", true, false);
  const hasMsl = G.weapons.seekers > 0 || G.weapons.missiles > 0;
  const mslLabel = G.weapons.seekers > 0 ? "HSK " + G.weapons.seekers : G.weapons.missiles > 0 ? "MSL " + G.weapons.missiles : "MSL –";
  drawChip(W * 0.315, H * 0.830, mslLabel, hasMsl, G.docks >= 1);
  const smkReady = G.weapons.smoke > 0 && G.smoke.cooldown <= 0;
  drawChip(W * 0.375, H * 0.830, G.weapons.smoke > 0 ? (smkReady ? "SMK " + G.weapons.smoke : "SMK " + Math.ceil(G.smoke.cooldown)) : "SMK –", smkReady, G.weapons.smoke > 0);
  drawChip(W * 0.435, H * 0.830, G.docks >= 3 ? "OIL " + G.weapons.oil : "OIL –", G.weapons.oil > 0, G.docks >= 3);
  // boost status lives above the MPH readout — the chip row is full
  if (G.boost.active > 0) {
    const blink = 0.7 + 0.3 * Math.sin(G.time * 12);
    qtext("BOOSTING", W / 2, H * 0.795, Math.round(H * 0.030), { color: "rgba(255,122,46," + blink.toFixed(2) + ")", align: "center" });
  } else if (G.boost.charges > 0) {
    qtext("PUSH ▲ = BOOST ×" + G.boost.charges, W / 2, H * 0.795, Math.round(H * 0.026), { color: "rgba(255,150,80,0.85)", align: "center", weight: "normal" });
  }
}
function drawChip(x, y, label, active, fitted) {
  ctx.font = "bold " + Math.round(H * 0.027) + "px 'Courier New', monospace";
  const wpx = ctx.measureText(label).width + W * 0.016;
  ctx.fillStyle = active ? "rgba(60,40,16,0.85)" : "rgba(20,20,26,0.75)";
  ctx.fillRect(x - wpx / 2, y - H * 0.021, wpx, H * 0.038);
  ctx.strokeStyle = active ? "#ffb45e" : fitted ? "rgba(255,180,94,0.35)" : "rgba(120,120,130,0.3)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x - wpx / 2, y - H * 0.021, wpx, H * 0.038);
  qtext(label, x, y + H * 0.009, Math.round(H * 0.027), { color: active ? "#ffd88f" : fitted ? "rgba(255,180,94,0.55)" : "rgba(140,140,150,0.45)", align: "center" });
}

function drawMirror(rz, alpha) {
  const mx = W * 0.33, my = H * 0.016, mw = W * 0.34, mh = H * 0.135;
  renderMirror(rz, alpha);
  ctx.fillStyle = "#0b0c10";
  roundRect(ctx, mx - 4, my - 4, mw + 8, mh + 8, 8); ctx.fill();
  ctx.drawImage(mirrorCanvas, mx, my, mw, mh);
  ctx.strokeStyle = "rgba(255,180,94,0.25)";
  ctx.lineWidth = 1.5;
  roundRect(ctx, mx - 4, my - 4, mw + 8, mh + 8, 8); ctx.stroke();
  ctx.textAlign = "left";
}

function drawButtons() {
  if (G.state !== "play") return;
  ctx.textAlign = "center";
  for (const b of buttons) {
    let active = false, enabled = true;
    if (b.name === "fire") active = input.fire;
    else if (b.name === "msl") enabled = G.weapons.missiles > 0 || G.weapons.seekers > 0;
    else if (b.name === "smoke") enabled = G.weapons.smoke > 0 && G.smoke.cooldown <= 0;
    else if (b.name === "oil") enabled = G.weapons.oil > 0;

    if (b.name === "fire") {
      // big red fire button — impossible to miss, pulses until first shot
      if (!G.hasFired) {
        const pulse = (G.time * 1.4) % 1;
        ctx.strokeStyle = "rgba(255,90,60," + (0.75 * (1 - pulse)).toFixed(2) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + pulse * b.r * 0.55, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = active ? "rgba(235,70,45,0.85)" : "rgba(150,35,25,0.6)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = active ? "#ffd0a0" : "rgba(255,140,100,0.8)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      qtext("FIRE", b.x, b.y + b.r * 0.04, Math.round(b.r * 0.32), { color: active ? "#fff0d8" : "#ffce9e", align: "center" });
      qtext("HOLD", b.x, b.y + b.r * 0.40, Math.round(b.r * 0.20), { color: active ? "#ffe8c8" : "rgba(255,200,150,0.75)", align: "center" });
      continue;
    }

    ctx.globalAlpha = enabled ? 1 : 0.28;
    ctx.fillStyle = active ? "rgba(255,180,94,0.35)" : "rgba(18,18,24,0.5)";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = active ? "#ffb45e" : "rgba(255,180,94,0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    // label + live ammo count (George: "add a number count to the oil slick and
    // smoke screen buttons to show how many we have", 2026-11-07)
    const hasCnt = b.name === "msl" || b.name === "smoke" || b.name === "oil";
    const cnt = b.name === "msl" ? G.weapons.missiles + G.weapons.seekers
              : b.name === "smoke" ? G.weapons.smoke : G.weapons.oil;
    qtext(b.label, b.x, hasCnt ? b.y - b.r * 0.10 : b.y + b.r * 0.14, Math.round(b.r * (hasCnt ? 0.30 : 0.34)), { color: active ? "#ffe1b0" : "rgba(255,190,110,0.8)", align: "center", alpha: enabled ? 1 : 0.28 });
    if (hasCnt) qtext(String(cnt), b.x, b.y + b.r * 0.48, Math.round(b.r * 0.34), { color: cnt > 0 ? "#ffd88f" : "rgba(160,150,140,0.6)", align: "center", alpha: enabled ? 1 : 0.28 });
  }
  ctx.textAlign = "left";
}

// #region joystick overlay — thumb-stick feedback -------------------------------------------------
function drawJoystick() {
  if (G.state !== "play") return;
  ctx.textAlign = "center";
  if (joy.id !== null) {
    // live stick: base ring + knob following the thumb
    ctx.fillStyle = "rgba(14,14,20,0.45)";
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, H * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,180,94,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
    // brake zone marker
    if (input.joyBrake) {
      ctx.fillStyle = "rgba(255,80,60,0.25)";
      ctx.beginPath(); ctx.arc(joy.bx, joy.by + H * 0.075, H * 0.05, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,180,94,0.8)";
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, H * 0.052, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(30,18,8,0.9)";
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, H * 0.024, 0, Math.PI * 2); ctx.fill();
  } else if (!G.usedSteer) {
    // ghost hint where the stick lives until the first steer
    const hx = W * 0.16, hy = H * 0.78;
    const pulse = 0.5 + 0.5 * Math.sin(G.time * 3.2);
    ctx.strokeStyle = "rgba(255,180,94," + (0.35 + 0.35 * pulse).toFixed(2) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, H * 0.11, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,180,94," + (0.30 + 0.30 * pulse).toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(hx, hy, H * 0.042, 0, Math.PI * 2); ctx.fill();
    qtext("◀ DRAG ▶", hx, hy - H * 0.145, Math.round(H * 0.030), { color: "rgba(255,210,150," + (0.55 + 0.35 * pulse).toFixed(2) + ")", align: "center" });
    qtext("PULL DOWN = BRAKE", hx, hy + H * 0.165, Math.round(H * 0.024), { color: "rgba(255,210,150," + (0.55 + 0.35 * pulse).toFixed(2) + ")", align: "center", weight: "normal" });
  }
  ctx.textAlign = "left";
}

// #region overlays — title, pause, game over, rotate screen ---------------------------------------
function drawAnnounce() {
  let y = H * 0.215;
  for (const a of G.announce) {
    const fade = clamp(Math.min(1, a.t / 0.5) * Math.min(1, (a.max - a.t) * 5 + 0.2), 0, 1);
    qtext(a.text, W / 2, y, Math.round(H * 0.055), { color: "#ffd88f", align: "center", alpha: fade, shadow: true, glow: "rgba(255,150,60,0.9)", glowBlur: Math.round(H * 0.02) });
    if (a.sub) {
      qtext(a.sub, W / 2, y + H * 0.042, Math.round(H * 0.032), { color: "rgba(255,210,150,0.9)", align: "center", alpha: fade, shadow: true, weight: "normal" });
    }
    y += a.sub ? H * 0.115 : H * 0.09;
  }
}

function drawVignette() {
  if (G.dmgFlash <= 0) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.85);
  g.addColorStop(0, "rgba(255,40,30,0)");
  g.addColorStop(1, "rgba(255,40,30," + (G.dmgFlash * 0.5).toFixed(3) + ")");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function panel(titleSize) {
  ctx.fillStyle = "rgba(10,6,14,0.72)";
  ctx.fillRect(0, 0, W, H);
}

function drawTitle() {

function drawPause() {

function drawOver() {

}

// #region frame render — buffer blit + CRT scanlines ----------------------------------------------
function render(alpha) {
  const shX = G.shake > 0 ? rand(-1, 1) * G.shake * 7 : 0;
  const shY = G.shake > 0 ? rand(-1, 1) * G.shake * 5 : 0;
  ctx.save();
  ctx.translate(shX, shY);

  // interpolated camera anchor — this is what kills the judder on 90/120Hz screens
  const rz = lerp(G.pz, G.playerZ, alpha);
  const rx = lerp(G.px, G.playerX, alpha);

  const camY = CFG.camHeight + segY(rz) + Math.sin(G.time * 31) * 0.012 * (G.speed / CFG.maxSpeed);
  drawSky(horizonY());
  drawWorld(camY, rz, rx, alpha);
  drawCockpit(rz, rx);
  if (G.state !== "title") {
    drawMirror(rz, alpha);
    drawHUD();
    drawButtons();
    drawJoystick();
  }
  drawAnnounce();
  drawVignette();

  // crosshair
  if (G.state === "play") {
    const aim = aimPoint(rz, rx);
    ctx.strokeStyle = "rgba(255,180,94,0.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(aim.x - 9, aim.y); ctx.lineTo(aim.x - 3, aim.y);
    ctx.moveTo(aim.x + 3, aim.y); ctx.lineTo(aim.x + 9, aim.y);
    ctx.moveTo(aim.x, aim.y - 9); ctx.lineTo(aim.x, aim.y - 3);
    ctx.moveTo(aim.x, aim.y + 3); ctx.lineTo(aim.x, aim.y + 9);
    ctx.stroke();
    if (G.lastAim && !G.lastAim.dead) {
      // target lock: what is it? (George: "can't tell a civilian from anyone else")
      const t = G.lastAim;
      const label = t.type === "civ" ? "CIVILIAN" : t.type === "truck" ? "SUPPLY" : t.type === "van" ? "VAN" : "SPY";
      const col = t.type === "civ" ? "#7fe0ff" : t.type === "truck" ? "#6fdc73" : t.type === "van" ? "#ffb45e" : "#ff5347";
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.85;
      ctx.strokeRect(aim.x - 13, aim.y - 13, 26, 26);
      ctx.globalAlpha = 1;
      qtext(label, aim.x, aim.y - 18, Math.round(H * 0.026), { color: col, align: "center", shadow: true });
    }
  }
  ctx.restore();

  if (G.state === "title") drawTitle();
  else if (G.state === "pause") drawPause();
  else if (G.state === "over") drawOver();

  // CRT scanlines, then the pixelated upscale blit
  ctx.fillStyle = "rgba(0,0,0,0.085)";
  for (let y = 1; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  vctx.drawImage(buf, 0, 0, buf.width, buf.height, 0, 0, canvas.width, canvas.height);
  // crisp text pass at full resolution (legibility over pixel purity)
  if (G.state === "title") drawTitleCrisp();
  flushText();
}

// #endregion frame render -------------------------------------------------------------------------
// #region main loop — fixed timestep + adaptive quality -------------------------------------------
const STEP = 1 / 60;
let last = 0, acc = 0;
let perfAcc = 0, perfN = 0, perfTier = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 5) { update(STEP); acc -= STEP; steps++; }
  render(clamp(acc / STEP, 0, 1));

  // adaptive quality: two graceful downgrades if the device can't hold 60
  perfAcc += dt; perfN++;
  if (perfN >= 150) {
    const avg = perfAcc / perfN;
    perfAcc = 0; perfN = 0;
    if (avg > 0.022 && perfTier === 0) { perfTier = 1; CFG.drawDist = 110; }
    else if (avg > 0.026 && perfTier === 1) { perfTier = 2; CFG.drawDist = 85; }
  }
}

function resize() {
  const cssW = window.innerWidth, cssH = window.innerHeight;
  canvas.width = cssW; canvas.height = cssH;
  PIX = clamp(Math.round(cssW / 380), 2, 4);
  buf.width = Math.max(280, Math.round(cssW / PIX));
  buf.height = Math.max(140, Math.round(cssH / PIX));
  W = buf.width; H = buf.height;
  ctx.imageSmoothingEnabled = false;
  vctx.imageSmoothingEnabled = false;
  mirrorCanvas.width = Math.max(80, Math.round(W * 0.34));
  mirrorCanvas.height = Math.max(24, Math.round(H * 0.135));
  camDepth = 1 / Math.tan((CFG.fov / 2) * Math.PI / 180);
  computeButtons(W, H);
}

// #endregion main loop ----------------------------------------------------------------------------
// #region boot — init, window.__test hooks, first frame -------------------------------------------
buildSprites();
buildTrack();
loadStore();
bindInput();
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 60));
requestAnimationFrame(frame);

// hidden hooks for automated playtesting (no gameplay effect)
window.__test = {
  G,
  start: startRun,
  spawnChaser: (d) => spawnChaser(d || 120),
  spawnEnemy: (dz) => {
    G.cars.push({
      z: G.playerZ + (dz || 150), x: G.playerX, baseX: G.playerX,
      speed: Math.max(20, G.speed - 2), type: "enemy", hp: CFG.enemyHp, spr: "enemy",
      dead: false, spin: 0, spinDir: 1, wob: 0, laneTimer: 99,
    });
  },
  giveAll: () => { G.weapons = { missiles: 6, seekers: 8, oil: 4, smoke: 3 }; G.docks = 4; },
  setArmor: (v) => { G.armor = v; },
  smoke: fireSmoke, oil: fireOil, missile: fireMissile, boost: fireBoost,
  spawnTruck: (dz) => spawnTruck(dz || 120),
  pickups: () => G.pickups,
};
// #endregion boot ---------------------------------------------------------------------------------

</script>
</body>
</html>
