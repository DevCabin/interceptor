<script>
"use strict";
/* ============================================================================
   INTERCEPTOR — Driver's Seat
   A first-person, mobile-first homage to Spy Hunter.
   Plain HTML + JS + Canvas. No libraries. No build step. One file.

   NAVIGATING THIS FILE
   --------------------
   The code is split into 22 #region sections in dependency order (later
   sections use earlier ones). In VS Code:  Cmd/Ctrl+Shift+O  then type a
   section name — or use the breadcrumbs, the Outline panel, or the fold
   gutter. Search for "// #region" to see the whole map at once.
   update() is further divided into nested #regions (boost, chasers, ...).

   SECTION INDEX                                       what lives there
   -------------------------------------------------------------------------
   CORE
     config ................. CFG — every tuning constant in the game
     utils .................. clamp / lerp / rand / easing / RNG helpers
     audio .................. AudioSys — Web Audio synth (no sound files)
     sprite factory ......... procedural art, rendered once at boot
     track .................. road segmentation + buildTrack()
     game state ............. G — all live state — resetGame(), announce()
     storage ................ high score + mute persistence
   INPUT & COMBAT
     input .................. touch joystick, buttons, keyboard, pause
     weapons ................ fire* functions, killCar(), targeting
     spawning ............... traffic, enemies, trucks, pursuers, drops
     van docking ............ the weapons-van resupply sequence
   SIMULATION
     update ................. the entire sim, one function (+ sub-regions)
   RENDERING
     rendering .............. projection, sky, ridges, drawWorld()
     mirror view ............ the rearview-mirror renderer
     cockpit ................ dash, A-pillars, steering wheel
     crisp text queue ....... qtext() / flushText() — READ BEFORE TEXT
     HUD .................... score, MPH, weapon chips, announcements
     joystick overlay ....... thumb-stick feedback
     overlays ............... title, pause, game over, rotate screen
   FRAME
     frame render ........... buffer blit + CRT scanlines
     main loop .............. fixed timestep + adaptive quality
     boot ................... init, window.__test hooks, first frame

   TWO OBJECTS TO KNOW: CFG (all tuning) and G (all live state).
   Deeper tour, day-one recipes and gotchas live in DEVELOPERS.md.
   ========================================================================= */

// #region config: CFG — every tuning constant in the game ----------------------------------------
const CFG = {
  segLen: 10,              // meters per road segment
  roadHalfW: 5.4,          // road half-width in meters (3 lanes)
  laneW: 3.6,
  drawDist: 150,           // segments drawn ahead
  camHeight: 1.18,         // driver eye height (m)
  fov: 82,
  maxSpeed: 66,            // m/s ~ 148 mph
  accel: 22,
  brakePow: 58,
  offroadMax: 26,
  boostSpeed: 105,         // m/s ~ 235 mph ("blast us well over 200")
  boostDuration: 4.5,
  boostCap: 2,
  steerSpeed: 11.5,        // lateral m/s at full lock
  centrifugal: 0.27,
  playerZ0: 0,
  gunCooldown: 0.095,
  gunRange: 420,
  gunDmg: 1,
  enemyHp: 3,
  smokeCooldown: 7,
  smokeDuration: 5,
  oilAmmo: 4,
  missileAmmo: 6,
  seekerAmmo: 8,
  chaserMax: 3,
  vanInterval: 38,         // seconds between weapons vans
  vanScore: 250,
};

// #endregion config -------------------------------------------------------------------------------
// #region utils — clamp / lerp / rand / easing / RNG helpers --------------------------------------
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function easeInOut(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// #endregion utils --------------------------------------------------------------------------------
// #region audio: AudioSys — Web Audio synth (engine, guns, music) --------------------------------
const AudioSys = (() => {
  let ctx = null, master = null, muted = false;
  let engineOsc = null, engineGain = null, engineFilter = null;
  let musicTimer = null, musicStep = 0;

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(ctx.destination);
      startEngine();
      return true;
    } catch (e) { return false; }
  }
  function resume() { if (ctx && ctx.state === "suspended") ctx.resume(); }

  function startEngine() {
    engineOsc = ctx.createOscillator();
    engineOsc.type = "sawtooth";
    engineOsc.frequency.value = 42;
    const sub = ctx.createOscillator();
    sub.type = "square";
    sub.frequency.value = 21;
    engineFilter = ctx.createBiquadFilter();
    engineFilter.type = "lowpass";
    engineFilter.frequency.value = 320;
    engineGain = ctx.createGain();
    engineGain.gain.value = 0.0;
    engineOsc.connect(engineFilter);
    sub.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(master);
    engineOsc.start(); sub.start();
    engineOsc._sub = sub;
  }
  function engine(speedPct, running) {
    if (!ctx || !engineOsc) return;
    const f = 38 + speedPct * 88;
    engineOsc.frequency.setTargetAtTime(f, ctx.currentTime, 0.08);
    engineOsc._sub.frequency.setTargetAtTime(f * 0.5, ctx.currentTime, 0.08);
    engineFilter.frequency.setTargetAtTime(240 + speedPct * 900, ctx.currentTime, 0.1);
    engineGain.gain.setTargetAtTime(running ? (0.045 + speedPct * 0.05) : 0, ctx.currentTime, 0.15);
  }

  function noiseBurst(dur, vol, filterFreq, type = "lowpass") {
    if (!ctx) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = filterFreq;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }
  function beep(freq, dur, vol, type = "square", when = 0) {
    if (!ctx) return;
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = ctx.createGain();
    const t = ctx.currentTime + when;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sweep(f0, f1, dur, vol, type = "sawtooth") {
    if (!ctx) return;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  const sfx = {
    gun() { noiseBurst(0.07, 0.28, 2600, "highpass"); },
    hit() { noiseBurst(0.08, 0.2, 900); },
    explosion() { noiseBurst(0.55, 0.5, 420); sweep(160, 30, 0.5, 0.3); },
    bigExplosion() { noiseBurst(0.9, 0.65, 300); sweep(220, 24, 0.8, 0.4); },
    missile() { sweep(300, 1400, 0.35, 0.22); noiseBurst(0.3, 0.16, 1800, "highpass"); },
    lock() { beep(880, 0.06, 0.14); beep(880, 0.06, 0.14, "square", 0.09); },
    smoke() { noiseBurst(0.5, 0.3, 700); },
    oil() { noiseBurst(0.25, 0.3, 300); beep(140, 0.2, 0.12, "sine"); },
    spinout() { sweep(500, 90, 0.7, 0.2, "square"); },
    boost() { sweep(200, 900, 0.55, 0.28, "sawtooth"); noiseBurst(0.45, 0.14, 1400, "highpass"); },
    damage() { noiseBurst(0.12, 0.4, 500); beep(90, 0.15, 0.2, "sine"); },
    crash() { noiseBurst(0.5, 0.55, 350); sweep(120, 28, 0.45, 0.35); },
    dock() { beep(523, 0.1, 0.16, "triangle"); beep(659, 0.1, 0.16, "triangle", 0.1); beep(784, 0.18, 0.18, "triangle", 0.2); },
    upgrade() { beep(440, 0.08, 0.15, "triangle"); beep(587, 0.08, 0.15, "triangle", 0.08); beep(880, 0.2, 0.18, "triangle", 0.16); },
    denied() { beep(160, 0.15, 0.14, "square"); },
    vanNear() { beep(392, 0.09, 0.13, "triangle"); beep(523, 0.14, 0.13, "triangle", 0.11); },
  };

  // tiny synthwave bass sequencer, plays only while driving
  const bassLine = [55, 0, 55, 65.4, 0, 55, 0, 49, 55, 0, 55, 65.4, 0, 73.4, 0, 65.4];
  function music(on) {
    if (!ctx) return;
    if (on && !musicTimer) {
      musicTimer = setInterval(() => {
        if (muted) return;
        const f = bassLine[musicStep % bassLine.length];
        if (f) {
          const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
          const g = ctx.createGain();
          const t = ctx.currentTime;
          g.gain.setValueAtTime(0.11, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          o.connect(g); g.connect(master);
          o.start(t); o.stop(t + 0.24);
        }
        musicStep++;
      }, 150);
    } else if (!on && musicTimer) {
      clearInterval(musicTimer); musicTimer = null;
    }
  }

  function setMuted(m) {
    muted = m;
    if (master) master.gain.value = m ? 0 : 0.55;
  }
  return { ensure, resume, engine, sfx, music, setMuted, get muted() { return muted; } };
})();
// #endregion audio --------------------------------------------------------------------------------
// #region sprite factory — procedural art, rendered once at boot ----------------------------------
// All art is generated once at boot into offscreen canvases, then blitted.
function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

// generic top-down-ish rear view of a car (what we see ahead of us)
function drawCarRear(g, w, h, body, opts = {}) {
  const cx = w / 2;
  // shadow
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath(); g.ellipse(cx, h * 0.94, w * 0.44, h * 0.06, 0, 0, Math.PI * 2); g.fill();
  // wheels
  g.fillStyle = "#0b0b0d";
  g.fillRect(w * 0.06, h * 0.66, w * 0.14, h * 0.24);
  g.fillRect(w * 0.80, h * 0.66, w * 0.14, h * 0.24);
  g.fillRect(w * 0.08, h * 0.16, w * 0.12, h * 0.18);
  g.fillRect(w * 0.80, h * 0.16, w * 0.12, h * 0.18);
  // body
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, opts.dark ? "#3a1220" : body);
  grad.addColorStop(0.55, body);
  grad.addColorStop(1, opts.dark ? "#200a12" : shade(body, -40));
  g.fillStyle = grad;
  roundRect(g, w * 0.14, h * 0.06, w * 0.72, h * 0.84, w * 0.09); g.fill();
  // trunk edge / roof / rear window
  g.fillStyle = shade(body, -25);
  roundRect(g, w * 0.18, h * 0.10, w * 0.64, h * 0.16, w * 0.05); g.fill();
  g.fillStyle = "#12161f";
  roundRect(g, w * 0.22, h * 0.13, w * 0.56, h * 0.11, w * 0.04); g.fill(); // rear glass
  // bumper
  g.fillStyle = "#2a2d33";
  roundRect(g, w * 0.16, h * 0.80, w * 0.68, h * 0.08, w * 0.03); g.fill();
  // taillights (dusk: glowing)
  g.fillStyle = opts.tailGlow === false ? "#7a1620" : "#ff2a33";
  g.shadowColor = "#ff2a33"; g.shadowBlur = opts.tailGlow === false ? 0 : 12;
  roundRect(g, w * 0.20, h * 0.76, w * 0.16, h * 0.05, 2); g.fill();
  roundRect(g, w * 0.64, h * 0.76, w * 0.16, h * 0.05, 2); g.fill();
  g.shadowBlur = 0;
  if (opts.enemy) {
    // menacing roof spoiler
    g.fillStyle = "#101014";
    roundRect(g, w * 0.24, h * 0.045, w * 0.52, h * 0.045, 3); g.fill();
  }
}

// front view of a car (what we see in the rearview mirror)
function drawCarFront(g, w, h, body) {
  const cx = w / 2;
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath(); g.ellipse(cx, h * 0.95, w * 0.44, h * 0.055, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#0b0b0d";
  g.fillRect(w * 0.05, h * 0.62, w * 0.15, h * 0.26);
  g.fillRect(w * 0.80, h * 0.62, w * 0.15, h * 0.26);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, shade(body, -18));
  grad.addColorStop(0.5, body);
  grad.addColorStop(1, shade(body, -45));
  g.fillStyle = grad;
  roundRect(g, w * 0.13, h * 0.10, w * 0.74, h * 0.80, w * 0.09); g.fill();
  // windshield
  g.fillStyle = "#0d1420";
  roundRect(g, w * 0.21, h * 0.14, w * 0.58, h * 0.20, w * 0.05); g.fill();
  g.fillStyle = "rgba(120,160,200,0.18)";
  roundRect(g, w * 0.23, h * 0.15, w * 0.24, h * 0.17, w * 0.04); g.fill();
  // grille
  g.fillStyle = "#15171c";
  roundRect(g, w * 0.30, h * 0.58, w * 0.40, h * 0.14, 3); g.fill();
  // headlights ON (dusk, intimidating)
  g.fillStyle = "#fff6c9";
  g.shadowColor = "#ffe27a"; g.shadowBlur = 16;
  g.beginPath(); g.ellipse(w * 0.24, h * 0.60, w * 0.075, h * 0.06, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(w * 0.76, h * 0.60, w * 0.075, h * 0.06, 0, 0, Math.PI * 2); g.fill();
  g.shadowBlur = 0;
}

// weapons van, rear view, Spy Hunter style
function drawVanRear(g, w, h) {
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath(); g.ellipse(w / 2, h * 0.95, w * 0.46, h * 0.05, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#0b0b0d";
  g.fillRect(w * 0.06, h * 0.70, w * 0.15, h * 0.22);
  g.fillRect(w * 0.79, h * 0.70, w * 0.15, h * 0.22);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#8f96a3"); grad.addColorStop(0.5, "#6e7580"); grad.addColorStop(1, "#484e57");
  g.fillStyle = grad;
  roundRect(g, w * 0.10, h * 0.05, w * 0.80, h * 0.86, w * 0.04); g.fill();
  // rear doors + ramp hint
  g.fillStyle = "#565d66";
  roundRect(g, w * 0.16, h * 0.12, w * 0.68, h * 0.72, w * 0.03); g.fill();
  g.strokeStyle = "#33383f"; g.lineWidth = Math.max(1, w * 0.008);
  g.beginPath(); g.moveTo(w / 2, h * 0.12); g.lineTo(w / 2, h * 0.84); g.stroke();
  // chevron stripes
  g.fillStyle = "#ffb02e";
  for (let i = 0; i < 4; i++) {
    g.fillRect(w * (0.20 + i * 0.07), h * 0.60, w * 0.045, h * 0.20);
    g.fillRect(w * (0.53 + i * 0.07), h * 0.60, w * 0.045, h * 0.20);
  }
  g.fillStyle = "#ff2a33"; g.shadowColor = "#ff2a33"; g.shadowBlur = 10;
  roundRect(g, w * 0.15, h * 0.86, w * 0.14, h * 0.045, 2); g.fill();
  roundRect(g, w * 0.71, h * 0.86, w * 0.14, h * 0.045, 2); g.fill();
  g.shadowBlur = 0;
}

// green garbage truck, rear view — supply vehicle, visibly not the gray van
function drawTruckRear(g, w, h) {
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath(); g.ellipse(w / 2, h * 0.96, w * 0.46, h * 0.05, 0, 0, Math.PI * 2); g.fill();
  // wheels (3 axles hinted)
  g.fillStyle = "#0b0b0d";
  for (const y of [0.56, 0.74, 0.88]) {
    g.fillRect(w * 0.05, h * y, w * 0.13, h * 0.12);
    g.fillRect(w * 0.82, h * y, w * 0.13, h * 0.12);
  }
  // compactor body — boxy, tall, GREEN
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#4d9440");
  grad.addColorStop(0.5, "#3a7a32");
  grad.addColorStop(1, "#265122");
  g.fillStyle = grad;
  roundRect(g, w * 0.10, h * 0.06, w * 0.80, h * 0.86, w * 0.03); g.fill();
  // rear loader ridges (vertical ribs)
  g.fillStyle = "rgba(0,0,0,0.22)";
  for (let i = 0; i < 5; i++) g.fillRect(w * (0.16 + i * 0.14), h * 0.30, w * 0.045, h * 0.52);
  // top lip of the hopper
  g.fillStyle = "#1d3d19";
  roundRect(g, w * 0.10, h * 0.06, w * 0.80, h * 0.09, w * 0.03); g.fill();
  // cab roof hint
  g.fillStyle = "#57a848";
  roundRect(g, w * 0.16, h * 0.10, w * 0.68, h * 0.08, w * 0.02); g.fill();
  // reflective chevrons (city sanitation style)
  g.fillStyle = "#d8e26a";
  for (let i = 0; i < 4; i++) {
    g.fillRect(w * (0.18 + i * 0.09), h * 0.74, w * 0.055, h * 0.10);
    g.fillRect(w * (0.50 + i * 0.09), h * 0.74, w * 0.055, h * 0.10);
  }
  // amber beacon
  g.fillStyle = "#ffb02e";
  g.shadowColor = "#ffb02e"; g.shadowBlur = 12;
  g.beginPath(); g.arc(w * 0.50, h * 0.20, w * 0.045, 0, Math.PI * 2); g.fill();
  g.shadowBlur = 0;
  // mudflaps + taillights
  g.fillStyle = "#15171c";
  g.fillRect(w * 0.06, h * 0.88, w * 0.14, h * 0.08);
  g.fillRect(w * 0.80, h * 0.88, w * 0.14, h * 0.08);
  g.fillStyle = "#ff2a33"; g.shadowColor = "#ff2a33"; g.shadowBlur = 10;
  roundRect(g, w * 0.14, h * 0.86, w * 0.13, h * 0.045, 2); g.fill();
  roundRect(g, w * 0.73, h * 0.86, w * 0.13, h * 0.045, 2); g.fill();
  g.shadowBlur = 0;
}

function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

// Pursuer tiers — a new color every sector, harder to put down each time
// (George, 2026-11-07). oilHp = slicks to spin out; smokeResist cuts the
// smoke shove/blind; speedBonus adds to closing speed; hpBonus beefs up the
// car they become after a brake-check overshoot.
const CHASER_TIERS = [
  { color: "#4a1522", name: "CRIMSON",  oilHp: 1, smokeResist: 0,    speedBonus: 0, hpBonus: 0 },
  { color: "#7a2f10", name: "EMBER",    oilHp: 1, smokeResist: 0.15, speedBonus: 2, hpBonus: 0 },

// #region track — road segmentation + buildTrack() (straight today) -------------------------------
const N_SEG = 2400;
const segments = [];   // { curve, y, sprites:[{spr, off}] }
const trackRand = mulberry32(6155);   // deterministic layout, endless loop

function addRoad(enter, hold, leave, curve, hill) {
  const startY = segments.length ? segments[segments.length - 1].y : 0;
  const endY = startY + hill * CFG.segLen;
  const total = enter + hold + leave;
  for (let n = 0; n < enter; n++)
    segments.push({ curve: easeInOut(n / enter) * curve, y: lerp(startY, endY, easeInOut(n / total)), sprites: [] });
  for (let n = 0; n < hold; n++)
    segments.push({ curve, y: lerp(startY, endY, easeInOut((enter + n) / total)), sprites: [] });
  for (let n = 0; n < leave; n++)
    segments.push({ curve: curve * (1 - easeInOut(n / leave)), y: lerp(startY, endY, easeInOut((enter + hold + n) / total)), sprites: [] });
}

function buildTrack() {
  segments.length = 0;
  while (segments.length < N_SEG) {
    const r = trackRand();
    // straight road for now — hills only, no lateral curves (per George, 2026-11-07)
    if (r < 0.5) addRoad(24, 24, 24, 0, trackRand() < 0.4 ? randFrom(trackRand, -0.5, 0.7) : 0);
    else if (r < 0.8) addRoad(20, 26, 20, 0, randFrom(trackRand, -0.3, 0.4));
    else addRoad(26, 30, 26, 0, randFrom(trackRand, -0.2, 0.3));
  }
  // roadside furniture
  for (let i = 0; i < N_SEG; i++) {
    if (i % 5 === 0 && trackRand() < 0.85) {
      const side = trackRand() < 0.5 ? -1 : 1;
      const kind = trackRand();
      const spr = kind < 0.5 ? "cactus" : kind < 0.8 ? "rock" : "sign";
      segments[i].sprites.push({ spr, off: side * randFrom(trackRand, 1.5, 4.5) });
      if (trackRand() < 0.35) {
        const spr2 = trackRand() < 0.6 ? "cactus" : "rock";
        segments[i].sprites.push({ spr: spr2, off: -side * randFrom(trackRand, 1.5, 4.5) });
      }
    }
  }
}
function randFrom(rng, a, b) { return a + rng() * (b - a); }
function segAt(z) {
  const i = Math.floor(z / CFG.segLen) % N_SEG;
  return segments[(i + N_SEG) % N_SEG];
}
function lastY() { return segments[N_SEG - 1].y; }
function segY(z) {
  const s = segAt(z);
  const s2 = segAt(z + CFG.segLen);
  const pct = (z % CFG.segLen) / CFG.segLen;
  return lerp(s.y, s2.y, pct);
}

// #region storage — high score + mute persistence (localStorage) ----------------------------------
const STORE_KEY = "interceptor.v1";
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.hi === "number" && isFinite(d.hi) && d.hi >= 0) G.hi = Math.floor(d.hi);
    if (typeof d.mute === "boolean") { G.muted = d.mute; AudioSys.setMuted(d.mute); }
  } catch (e) { /* corrupted storage: start fresh */ }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ hi: G.hi, mute: G.muted })); } catch (e) {}
}

// #region input — touch joystick, buttons, keyboard, pause ----------------------------------------
const input = { left: false, right: false, brake: false, fire: false, axis: 0, joyBrake: false, joyBoost: false };
const pointers = new Map();   // pointerId -> button name | "joy"
let buttons = [];             // layout-computed hit circles { name, x, y, r, label }
// left-thumb virtual joystick: anchors where the thumb lands, drag to steer
const joy = { id: null, bx: 0, by: 0, kx: 0, ky: 0 };

function computeButtons(W, H) {
  const rB = H * 0.075, rF = H * 0.125;
  buttons = [
    { name: "fire",  x: W * 0.915, y: H * 0.780, r: rF, label: "FIRE" },
    { name: "msl",   x: W * 0.770, y: H * 0.650, r: rB, label: "MSL" },
    { name: "smoke", x: W * 0.735, y: H * 0.875, r: rB, label: "SMK" },
    { name: "oil",   x: W * 0.860, y: H * 0.900, r: rB, label: "OIL" },
    { name: "pause", x: W * 0.955, y: H * 0.055, r: H * 0.042, label: "❚❚" },
  ];
}
function buttonAt(x, y) {
  for (const b of buttons) {
    const dx = x - b.x, dy = y - b.y;
    if (dx * dx + dy * dy <= b.r * b.r) return b;
  }
  return null;
}
function pressButton(name) {
  switch (name) {
    case "fire": input.fire = true; break;
    case "msl": fireMissile(); break;
    case "smoke": fireSmoke(); break;
    case "oil": fireOil(); break;
    case "pause": setPause(true); break;
  }
}
function releaseButton(name) {
  if (name === "fire") input.fire = false;
}

const canvas = document.getElementById("game");
let W = 0, H = 0, PIX = 3;   // W/H = buffer pixels; PIX = css px per buffer px

function bindInput() {
  const opts = { passive: false };
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    firstGesture();
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
    if (G.state === "title" || G.state === "over") { startRun(); return; }
    if (G.state === "pause") { setPause(false); return; }
    const b = buttonAt(x, y);
    if (b) { pointers.set(e.pointerId, b.name); pressButton(b.name); return; }
    // left-thumb zone: drop the stick where the thumb lands
    if (joy.id === null && x < W * 0.48 && y > H * 0.40) {
      joy.id = e.pointerId;
      joy.bx = x; joy.by = y; joy.kx = x; joy.ky = y;
      pointers.set(e.pointerId, "joy");
    }
  }, opts);
  const clear = (e) => {
    const name = pointers.get(e.pointerId);
    if (name === "joy") { joy.id = null; input.axis = 0; input.joyBrake = false; input.joyBoost = false; }
    else if (name) releaseButton(name);
    pointers.delete(e.pointerId);
  };
  canvas.addEventListener("pointerup", clear, opts);
  canvas.addEventListener("pointercancel", clear, opts);
  canvas.addEventListener("pointermove", (e) => {
    if (pointers.get(e.pointerId) !== "joy") return;
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
    const range = H * 0.14;
    input.axis = clamp((x - joy.bx) / range, -1, 1);
    input.joyBrake = (y - joy.by) > H * 0.075;
    input.joyBoost = (joy.by - y) > H * 0.075;
    joy.kx = joy.bx + clamp(x - joy.bx, -range, range);
    joy.ky = joy.by + clamp(y - joy.by, -range * 0.4, range * 0.7);
    G.usedSteer = true;
  }, opts);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  // belt-and-braces for mobile: stop the browser from ever treating canvas
  // touches as scroll/zoom/long-press gestures (which pointercancel the hold)
  canvas.addEventListener("touchstart", (e) => e.preventDefault(), opts);
  canvas.addEventListener("touchmove", (e) => e.preventDefault(), opts);
  // safety net: if the OS still cancels a held touch, don't leave inputs stuck
  canvas.addEventListener("pointerleave", clear, opts);

  window.addEventListener("keydown", (e) => {
    if (e.repeat) { if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp","Space"].includes(e.code)) e.preventDefault(); return; }
    firstGesture();
    switch (e.code) {
      case "ArrowLeft": case "KeyA": input.left = true; e.preventDefault(); break;
      case "ArrowRight": case "KeyD": input.right = true; e.preventDefault(); break;
      case "ArrowDown": case "KeyS": input.brake = true; e.preventDefault(); break;
      case "ArrowUp": case "KeyW": fireBoost(); e.preventDefault(); break;
      case "Space": case "KeyZ":
        e.preventDefault();
        if (G.state === "title" || G.state === "over") startRun();
        else if (G.state === "pause") setPause(false);
        else input.fire = true;
        break;
      case "KeyX": fireMissile(); break;
      case "KeyC": fireSmoke(); break;
      case "KeyV": fireOil(); break;
      case "KeyP": case "Escape": if (G.state === "play" || G.state === "pause") setPause(G.state === "play"); break;
      case "KeyM": toggleMute(); break;
      case "Enter": if (G.state === "title" || G.state === "over") startRun(); break;
    }
  });
  window.addEventListener("keyup", (e) => {
    switch (e.code) {
      case "ArrowLeft": case "KeyA": input.left = false; break;
      case "ArrowRight": case "KeyD": input.right = false; break;
      case "ArrowDown": case "KeyS": input.brake = false; break;
      case "Space": case "KeyZ": input.fire = false; break;
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && G.state === "play") setPause(true);
  });
}

let audioStarted = false;
function firstGesture() {
  if (!audioStarted) {
    audioStarted = AudioSys.ensure();
    if (audioStarted) AudioSys.setMuted(G.muted);
  }
  AudioSys.resume();
  // best-effort fullscreen on phones (landscape already enforced by overlay)
  if (/Android|iPhone|iPad/i.test(navigator.userAgent) && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
}
function toggleMute() {
  G.muted = !G.muted;
  AudioSys.setMuted(G.muted);
  saveStore();
}
function setPause(on) {
  if (on && G.state === "play") { G.state = "pause"; AudioSys.music(false); AudioSys.engine(0, false); }
  else if (!on && G.state === "pause") { G.state = "play"; AudioSys.music(true); }
}
function startRun() {
  resetGame();
  G.state = "play";
  AudioSys.music(true);
  announce("WEAPONS HOT", "machine guns online — good hunting", 2.8);
}

// #region weapons — fire* functions, killCar(), explosions, targeting -----------------------------
function fireSmoke() {
  if (G.state !== "play") return;
  if (G.weapons.smoke <= 0) { AudioSys.sfx.denied(); announce("NO SMOKE SCREEN", "dock with the weapons van", 1.6); return; }
  if (G.smoke.cooldown > 0 || G.smoke.active > 0) return;
  G.weapons.smoke--;
  G.smoke.active = CFG.smokeDuration;
  G.smoke.cooldown = CFG.smokeCooldown;
  AudioSys.sfx.smoke();
  announce("SMOKE SCREEN", "pursuers blinded", 1.4);
}
function fireOil() {
  if (G.state !== "play") return;
  if (G.weapons.oil <= 0) { AudioSys.sfx.denied(); if (G.docks > 0) announce("OIL DEPLETED", "dock with the weapons van", 1.6); return; }
  if (G.slicks.length >= 2) return;
  G.weapons.oil--;
  G.slicks.push({ dist: 9, t: 9, x: G.playerX });
  AudioSys.sfx.oil();
}
// speed boost — supply-drop charge, lit with stick-up / ↑ / W (George, 2026-11-07)
function fireBoost() {
  if (G.state !== "play" || G.boost.active > 0) return;
  if (G.boost.charges <= 0) { AudioSys.sfx.denied(); return; }
  G.boost.charges--;
  G.boost.active = CFG.boostDuration;
  AudioSys.sfx.boost();
  announce("BOOST!", "hold the line — 200+ mph", 1.3);
}
function fireMissile() {
  if (G.state !== "play") return;
  const seeker = G.weapons.seekers > 0;
  if (!seeker && G.weapons.missiles <= 0) {
    if (G.docks > 0) { AudioSys.sfx.denied(); announce("MISSILES DEPLETED", "dock with the weapons van", 1.6); }
    return;
  }
  let target = null;
  if (seeker) {
    G.weapons.seekers--;
    let best = Infinity;
    for (const c of G.cars) {
      if (c.dead || c.type !== "enemy") continue;
      const dz = c.z - G.playerZ;
      if (dz > 5 && dz < 650 && Math.abs(c.x - G.playerX) < 4 && dz < best) { best = dz; target = c; }
    }
    AudioSys.sfx.lock();
  } else {
    G.weapons.missiles--;
  }
  G.missiles.push({ z: G.playerZ + 6, x: G.playerX, speed: G.speed + 58, target, t: 0 });
  AudioSys.sfx.missile();
}

function killCar(car, cause) {
  if (car.dead) return;
  car.dead = true;
  car.spin = 0.01;
  car.spinDir = Math.random() < 0.5 ? -1 : 1;
  if (car.type === "civ") {
    G.score = Math.max(0, G.score - 300);
    announce("CIVILIAN DOWN", "-300", 1.8);
  } else {
    G.kills++;
    G.score += cause === "missile" || cause === "seeker" ? 150 : 100;
  }
  if (car.type === "truck") {
    // supply drop stays on the road where the truck died
    const kind = DROP_CYCLE[G.dropIdx % DROP_CYCLE.length];
    G.dropIdx++;
    G.pickups.push({ z: car.z, x: car.x, kind, pz: car.z, t: 0, bob: rand(0, 6.28) });
    announce("SUPPLY DROP OUT", "drive through the glowing pickup", 1.8);
  }
  spawnExplosion(car.x, segY(car.z) + 1, car.z, car.type === "van" ? 1.6 : 1);
  AudioSys.sfx.explosion();
  G.shake = Math.min(G.shake + 0.25, 1);
}

function spawnExplosion(wx, wy, wz, scale) {
  for (let i = 0; i < 26 * scale; i++) {
    G.particles.push({
      wx, wy, wz,
      vx: rand(-7, 7), vy: rand(2, 14) * scale, vz: rand(-6, 10),
      life: rand(0.4, 1.0), t: 0,
      size: rand(0.25, 0.8) * scale,
      color: choice(["#ffd23e", "#ff8c2a", "#ff4a22", "#5a5a5a", "#2a2a2a"]),
    });
  }
}
function spawnSparks(wx, wy, wz) {
  for (let i = 0; i < 6; i++) {
    G.particles.push({
      wx, wy, wz,
      vx: rand(-3, 3), vy: rand(1, 6), vz: rand(-2, 2),
      life: rand(0.15, 0.35), t: 0,
      size: rand(0.08, 0.2), color: "#ffe98a",
    });
  }
}

function findGunTarget() {
  let target = null, best = Infinity;
  for (const c of G.cars) {
    if (c.dead || c.type === "van") continue; // friendly support vehicle — you dock it, you don't shoot it
    const dz = c.z - G.playerZ;
    if (dz < 4 || dz > CFG.gunRange) continue;
    const cone = 1.7 + dz * 0.006;      // forgiving — must be able to hit supply trucks cross-lane
    if (Math.abs(c.x - G.playerX) < cone && dz < best) { best = dz; target = c; }
  }
  return target;
}
